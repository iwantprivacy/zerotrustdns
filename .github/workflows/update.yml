name: Update blocklists
on:
  schedule:
    - cron: "0 3 * * *"  # Tự chạy mỗi ngày lúc 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerotrustdns-update
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm start
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LIST_ITEM_LIMIT: ${{ vars.CLOUDFLARE_LIST_ITEM_LIMIT }}
          CLOUDFLARE_LIST_ACCOUNT_LIMIT: ${{ vars.CLOUDFLARE_LIST_ACCOUNT_LIMIT }}
          CLOUDFLARE_MIN_DOMAIN_RETENTION_RATIO: ${{ vars.CLOUDFLARE_MIN_DOMAIN_RETENTION_RATIO }}
          CLOUDFLARE_ALLOW_LARGE_SHRINK: ${{ vars.CLOUDFLARE_ALLOW_LARGE_SHRINK }}
          BLOCK_PAGE_ENABLED: ${{ vars.BLOCK_PAGE_ENABLED }}
          BLOCKLIST_URLS: ${{ secrets.BLOCKLIST_URLS }}
          ALLOWLIST_URLS: ${{ secrets.ALLOWLIST_URLS }}
