name: Update blocklists
on:
  schedule:
    - cron: "0 3 * * *"  # Tự chạy mỗi ngày lúc 03:00 UTC
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: zerotrustdns-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  update:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - run: cargo run --locked --release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LIST_ITEM_LIMIT: ${{ vars.CLOUDFLARE_LIST_ITEM_LIMIT }}
          CLOUDFLARE_LIST_ACCOUNT_LIMIT: ${{ vars.CLOUDFLARE_LIST_ACCOUNT_LIMIT }}
          CLOUDFLARE_MIN_DOMAIN_RETENTION_RATIO: ${{ vars.CLOUDFLARE_MIN_DOMAIN_RETENTION_RATIO }}
          CLOUDFLARE_ALLOW_LARGE_SHRINK: ${{ vars.CLOUDFLARE_ALLOW_LARGE_SHRINK }}
          BLOCKLIST_URLS: ${{ secrets.BLOCKLIST_URLS }}
          ALLOWLIST_URLS: ${{ secrets.ALLOWLIST_URLS }}
